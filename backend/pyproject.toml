[project]
name = "backend"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "bcrypt==4.0.1",
    "email-validator==2.2.0",
    "fastapi==0.115.0",
    # 2.2.2 was built before numpy 2.x and segfaults on to_datetime when
    # resolved against a current numpy — which took the whole dashboard
    # down, not just the request. Keep these two moving together.
    "pandas>=2.3.0",
    "numpy>=2.1.0",
    "passlib==1.7.4",
    "pdfplumber==0.11.4",
    "pydantic==2.9.2",
    "pydantic-settings==2.5.2",
    "python-dotenv==1.0.1",
    "python-jose[cryptography]==3.3.0",
    "python-dateutil>=2.9.0",
    "python-multipart==0.0.9",
    "scikit-learn==1.5.2",
    "sqlalchemy==2.0.35",
    "uvicorn[standard]==0.30.6",
]

[dependency-groups]
dev = [
    "poethepoet>=0.48.0",
    "pytest>=8.3.0",
    "httpx>=0.27.0",
    # Used only by tests/test_pdf_parser.py, to generate statement PDFs in
    # the layouts the parser has to cope with.
    "reportlab>=4.2.0",
]

# `backend/app` imports itself as `backend.app...`, so these tasks add the
# repo root (one level up from this pyproject.toml) to sys.path via
# uvicorn's --app-dir, regardless of what directory `uv run poe ...` is
# invoked from.
[tool.poe.tasks]
dev = "uvicorn backend.app.main:app --reload --app-dir .."
start = "uvicorn backend.app.main:app --app-dir .."
test = "pytest tests"

# Runs from the repo root so `backend.app...` imports resolve, the same
# reason dev/start pass --app-dir ...
[tool.poe.tasks.seed-demo]
cmd = "python -m backend.app.scripts.seed_demo"
cwd = ".."
